version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: anticristiancpu-piper-omnivoice_server_1
      APP_PORT: 5000

  server:
    image: rhasspy/wyoming-piper:2.4.2-omnivoice
    restart: on-failure
    environment:
      TZ: "Europe/Rome"
    command:
      - "--backend"
      - "omnivoice"
      - "--omnivoice-language"
      - "it"
      - "--omnivoice-ref-dir"
      - "/data/ref"
      - "--web-server"
      - "--web-server-host"
      - "0.0.0.0"
    ports:
      - "10202:10200"
    volumes:
      - ${APP_DATA_DIR}/data:/data
