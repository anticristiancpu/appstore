version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: anticristiancpu-whisper_server_1
      APP_PORT: 10300
      PROXY_AUTH_ADD: "false"

  server:
    image: rhasspy/wyoming-whisper:3.6.0
    restart: on-failure
    environment:
      TZ: "Europe/Rome"
    command:
      - "--model"
      - "small-int8"
      - "--language"
      - "it"
      - "--beam-size"
      - "1"
    ports:
      - "10300:10300"
    volumes:
      - ${APP_DATA_DIR}/data:/data
