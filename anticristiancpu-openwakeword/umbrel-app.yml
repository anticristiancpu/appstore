manifestVersion: 1.1
id: anticristiancpu-openwakeword
category: automation
name: Wyoming openWakeWord
version: "2.1.0-1"
tagline: Rilevamento parola di attivazione per Home Assistant
icon: https://brands.home-assistant.io/_/openwakeword/icon.png
description: >-
  Server Wyoming per openWakeWord: rileva la parola di attivazione ("Ok Nabu",
  "Hey Jarvis", "Alexa") in locale, permettendo agli speaker satellite di
  attivarsi a mani libere come Alexa o Google Home.


  Serve solo se usi satelliti che NON fanno il wake word a bordo. I dispositivi
  ESPHome recenti e Home Assistant Voice PE lo rilevano gia' on-device: in quel
  caso questa app non e' necessaria.


  ATTENZIONE: e' un servizio headless, parla il protocollo Wyoming su TCP e NON
  ha un'interfaccia web. La tile in umbrelOS non aprira' nessuna pagina: e' normale.


  Come collegarlo a Home Assistant:

  1. Impostazioni -> Dispositivi e servizi -> Aggiungi integrazione -> Wyoming Protocol

  2. Host: localhost   Porta: 10400

  3. Impostazioni -> Assistenti vocali -> sezione "Parola di attivazione"


  Modelli inclusi nel pacchetto, gia' selezionabili da Home Assistant senza
  configurazione: okay_nabu, hey_jarvis, alexa, hey_mycroft, hey_rhasspy.
  Nessun download al primo avvio.


  Per parole di attivazione personalizzate, copia i file .tflite nella cartella
  custom dei dati dell'app (montata su /custom) e riavvia.


developer: Rhasspy / David Scripka
website: https://github.com/dscripka/openWakeWord
dependencies: []
repo: https://github.com/rhasspy/wyoming-addons
support: https://github.com/rhasspy/wyoming-addons/issues
releaseNotes: >-
  Rimossi i flag --preload-model, deprecati e ignorati dalla 2.1.0.
port: 10401
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
